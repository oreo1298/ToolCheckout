name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub Release for the version in src-tauri/tauri.conf.json
        type: boolean
        default: false

concurrency:
  # Per event, so a push can't cancel a manually started release run.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libssl-dev libxdo-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Frontend type-check
        run: npm run check
      - name: Frontend tests
        run: npm test
      - name: Frontend build (embedded by the Rust build)
        run: npm run build
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --workspace

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
      - name: Core tests
        run: cargo test -p toolcheckout-core

  build-linux:
    name: Build (Linux AppImage + deb)
    needs: test-linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libssl-dev libxdo-dev patchelf file
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-release
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build bundles
        run: npx tauri build --bundles appimage,deb
      - uses: actions/upload-artifact@v4
        with:
          name: ToolCheckout-linux-appimage
          path: target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ToolCheckout-linux-deb
          path: target/release/bundle/deb/*.deb
          if-no-files-found: error

  build-windows:
    name: Build (Windows installer + portable)
    needs: test-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-release
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build per-user NSIS installer
        run: npx tauri build --bundles nsis
      - name: Verify the installer never asks for elevation
        shell: pwsh
        run: |
          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          # NSIS embeds the requested execution level in the PE manifest.
          $bytes = [System.IO.File]::ReadAllBytes($setup.FullName)
          $text = [System.Text.Encoding]::UTF8.GetString($bytes)
          if ($text -match 'requireAdministrator') { throw "Installer requests administrator rights" }
          if ($text -notmatch 'level="asInvoker"') { throw "Installer manifest is not asInvoker" }
          Write-Host "OK: $($setup.Name) runs asInvoker (per-user, no UAC)"
      - name: Assemble portable build
        shell: pwsh
        run: |
          $dir = "portable/ToolCheckout-portable"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target/release/ToolCheckout.exe "$dir/ToolCheckout.exe"
          Set-Content -Path "$dir/portable" -Value "Data is stored in the 'data' folder next to ToolCheckout.exe."
          Copy-Item packaging/README-portable.txt "$dir/README-portable.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: ToolCheckout-windows-installer
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ToolCheckout-windows-portable
          path: portable/ToolCheckout-portable/
          if-no-files-found: error

  # Publishes a GitHub Release with the builds, either when a tag such as
  # v0.2.0 is pushed, or from Actions -> CI -> Run workflow with "Publish a
  # GitHub Release" ticked (which creates the tag v<version> on that commit).
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Work out the version and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match version $version in src-tauri/tauri.conf.json" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists. Bump the version for a new release." >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Assemble release files
        run: |
          set -eu
          mkdir release portable
          cp artifacts/ToolCheckout-windows-installer/*-setup.exe release/
          cp -r artifacts/ToolCheckout-windows-portable portable/ToolCheckout
          (cd portable && zip -r -9 "../release/ToolCheckout_${VERSION}_x64-portable.zip" ToolCheckout)
          cp artifacts/ToolCheckout-linux-appimage/*.AppImage release/
          cp artifacts/ToolCheckout-linux-deb/*.deb release/
          (cd release && sha256sum -- * > ../SHA256SUMS.txt)
          mv SHA256SUMS.txt release/
          cat release/SHA256SUMS.txt
          unzip -l release/*-portable.zip
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # For a manual run this also creates the tag, on the commit that
          # was built.
          gh release create "$TAG" release/* \
            --target "$GITHUB_SHA" \
            --title "ToolCheckout $VERSION" \
            --notes-file packaging/release-notes.md
