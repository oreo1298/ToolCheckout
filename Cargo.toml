[workspace]
resolver = "3"
members = ["crates/core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["ToolCheckout contributors"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true

# PIN hashing and SQLite are slow unoptimized; keep debug builds and tests snappy.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.libsqlite3-sys]
opt-level = 3
